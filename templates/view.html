<!DOCTYPE html>
<html>
<head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

<div class="card p-4 shadow">

<h3>Patient Details</h3>

<ul class="list-group mb-3">
<li class="list-group-item">ID: {{patient.id}}</li>
<li class="list-group-item">Name: {{patient.name}}</li>
<li class="list-group-item">Age: {{patient.age}}</li>
<li class="list-group-item">Gender: {{patient.gender}}</li>
</ul>

<h5>History</h5>

<ul class="list-group">
{% for h in patient.history %}
<li class="list-group-item">
{{h.date}} - {{h.result}} ({{h.confidence}}%)
</li>
{% else %}
<li class="list-group-item">No history</li>
{% endfor %}
</ul>

<br>

<a href="/download/{{patient.id}}" class="btn btn-primary">Download Report</a>
<a href="/" class="btn btn-secondary">Back</a>

</div>

</div>

</body>
</html>
