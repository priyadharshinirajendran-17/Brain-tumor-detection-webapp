<!DOCTYPE html>
<html>
<head>
<title>Add Patient</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
.card{
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}
</style>
</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card p-4">

<h3 class="mb-3">➕ Add Patient</h3>

<form method="POST" enctype="multipart/form-data">

<input class="form-control mb-2" name="name" placeholder="Name" required>

<input class="form-control mb-2" name="age" type="number" placeholder="Age" required>

<select class="form-control mb-2" name="gender">
<option>Male</option>
<option>Female</option>
<option>Transgender</option>
</select>

<!-- 🔐 UPDATED KEY FIELD -->
<label class="mt-2">Access Key</label>
<input class="form-control mb-1"
       name="key"
       pattern="[0-9]{10}"
       placeholder="Enter 10-digit secure key"
       required>

<small class="text-muted mb-2 d-block">
🔐 This key will be encrypted using AES + PBKDF2 for security
</small>

<input type="file" name="file" class="form-control mb-3" required>

<button class="btn btn-primary">Add Patient</button>
<a href="/" class="btn btn-secondary">Back</a>

</form>

</div>
</div>

</body>
</html>
