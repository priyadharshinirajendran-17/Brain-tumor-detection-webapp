<!DOCTYPE html>
<html>
<head>
<title>Search & Predict</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
.card{
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}
.model-btn{
    min-width:120px;
}
</style>

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card p-4">

<h3 class="mb-3">🔍 Search & Predict</h3>

<div class="alert alert-info">
Enter Patient ID and Key, then choose a model
</div>

<form method="POST">

<!-- PATIENT ID -->
<input class="form-control mb-2" name="id" placeholder="Patient ID" required>

<!-- KEY -->
<input class="form-control mb-3" name="key" placeholder="10 digit key" required>

<!-- MODEL BUTTONS -->
<label class="mb-2"><b>Select Model:</b></label>

<div class="d-flex flex-wrap gap-2 mb-3">

<button type="submit" name="model" value="efficientnet" class="btn btn-info model-btn">
EfficientNet
</button>

<button type="submit" name="model" value="custom" class="btn btn-dark model-btn">
Custom CNN
</button>

</div>

<!-- BACK -->
<a href="/" class="btn btn-secondary">Back</a>

</form>

</div>

</div>

</body>
</html>
